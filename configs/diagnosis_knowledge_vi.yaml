# Vietnamese companion of configs/diagnosis_knowledge.yaml (same keys), plus English/Vietnamese display names.
# Every user-facing text in the apps must exist in both languages: English comes from diagnosis_knowledge.yaml
# (or display_names below), Vietnamese from this file. These are translations of the draft knowledge, not reviewed
# technical content; the reviewed component information lives in apps/engine_bay_android/.../components.json.

